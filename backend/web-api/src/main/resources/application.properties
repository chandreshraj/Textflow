server.port=${PORT:8080}
server.address=127.0.0.1
server.error.include-stacktrace=never
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true

# Browsers negotiate compressed previews and static assets; retain the same JSON contract.
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=application/json,application/javascript,text/javascript,text/css,text/html,image/svg+xml
